# vim:ft=lf
# @author nate zhou
# @since 2025,2026
# lf/rifle.conf - file opener

cmd open &{{
    term="footclient"
    open_img() {
        # open files in the sorted order in lf
        local LIST="${XDG_RUNTIME_DIR}/rifle"
        ${HOME}/.config/lf/lf-rearrange.sh "$f"

        if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
            setsid -f nsxiv - < "$LIST" >/dev/null 2>&1
        else
            lf -remote "send $id \$mpv --playlist="$LIST" --playlist-start=0 \
                                       --loop-playlist"
        fi
    }

    case "$(file --mime-type -Lb -- "$f")" in
        image/x-xcf)
            for xcf in $fx; do gimp "$xcf"; done
            ;;
        image/*|font/ttf)
            open_img
            ;;
        video/*)
            LIST="${XDG_RUNTIME_DIR}/rifle"
            ${HOME}/.config/lf/lf-rearrange.sh "$f"
            if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
                setsid -f mpv --playlist="$LIST" --playlist-start=0 --loop-playlist \
                    </dev/null >/dev/null 2>&1
            else
                lf -remote "send $id \$mpv --playlist="$LIST" \
                                              --playlist-start=0 \
                                              --loop-playlist"
            fi
            ;;
        audio/*)
            LIST="${XDG_RUNTIME_DIR}/rifle"
            ${HOME}/.config/lf/lf-rearrange.sh "$f"
            if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
                setsid -f mpv --playlist="$LIST" --playlist-start=0 --loop-playlist \
                    </dev/null >/dev/null 2>&1
            else
                lf -remote "send $id \$mpv --playlist="$LIST" \
                                              --playlist-start=0 \
                                              --loop-playlist"
            fi
            ;;
        */pdf|*/epub*)
            if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
                setsid -f zathura "$f" </dev/null >/dev/null 2>&1
            else
                pdftotext "$f" - | less -i
            fi
            ;;
		application/*opendocument*|*officedocument*)
            for od in $fx; do libreoffice "$od"; done
            ;;
        application/octet-stream)
            case "$f" in
                *.gpg)
                    lf -remote "send $id \$${HOME}/.local/bin/gpg-rifle \$f"
                    ;;
                *.mp3)
                    LIST="${XDG_RUNTIME_DIR}/rifle"
                    ${HOME}/.config/lf/lf-rearrange.sh "$f"
                    if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
                        setsid -f mpv --playlist="$LIST" --playlist-start=0 \
                            --loop-playlist --audio-display=no \
                            </dev/null >/dev/null 2>&1
                    else
                        lf -remote "send $id \$mpv --playlist="$LIST" \
                                                      --playlist-start=0 \
                                                      --loop-playlist \
                                                      --audio-display=no"
                    fi
                    ;;
                *)
                    lf -remote "send $id \$$EDITOR -p \$fx"
                    ;;
            esac
            ;;
        message/rfc822)
            [ "$XDG_SESSION_TYPE" != "tty" ] \
                && "$term" mutt -f "$(realpath -- "$f" | rev | cut -d'/' -f3- | rev)" \
                || lf -remote "send $id \$mutt -f "$(realpath \$f \
                                         | rev | cut -d'/' -f3- | rev)""
            ;;
        text/troff)
            lf -remote "send $id \$man -l \$f"
            ;;
        text/html)
            case "$f" in
                *.svg)
                    open_img
                    ;;
                *.md)
                    lf -remote "send $id \$$EDITOR -p \$fx"
                    ;;
                *)
                    if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
                        setsid -f qutebrowser "$f" </dev/null >/dev/null 2>&1
                    else
                        lf -remote "send $id \$w3m \$fx"
                    fi
                    ;;
            esac
            ;;
        text/*|*/json|inode/x-empty|application/javascript|application/mbox|application/pgp-signature|application/pgp-keys|application/x-wine-extension-ini|application/postscript)
            case "$f" in
                *.svg)
                    open_img
                    ;;
                *)
                    lf -remote "send $id \$$EDITOR -p \$fx"
                    ;;
            esac
            ;;
        application/*)
            case "$f" in
                *.epub) # some epub's mime type is application/zip
                    if [ -n "$DISPLAY" ] || [ -n "$WAYLAND_DISPLAY" ]; then
                        setsid -f zathura "$f" </dev/null >/dev/null 2>&1
                    else
                        pdftotext "$f" - | less -i
                    fi
                    ;;
                *)
                   lf -remote "send $id \$${HOME}/.local/bin/scope \$f"
                   ;;
            esac
            ;;
    esac
}}
